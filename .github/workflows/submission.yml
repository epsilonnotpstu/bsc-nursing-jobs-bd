name: Process circular submission

# A "Submit a circular" issue is processed only when the repo owner adds the `approved` label.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  process:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=scraper --include-workspace-root
      - name: Read circular with AI
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
          NODE_EXTRA_CA_CERTS: ./certs/extra-ca.pem
        run: npx tsx src/submissions.ts
      - name: Merge into site data
        working-directory: scraper
        run: npm run scrape -- --only=submission
      - name: Commit data
        run: |
          git config user.name "nursing-jobs-bot"
          git config user.email "nursing-jobs-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: add submission #${{ github.event.issue.number }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file ${{ runner.temp }}/summary.md
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "❌ সার্কুলারটি প্রসেস করা যায়নি / Could not process this circular. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
