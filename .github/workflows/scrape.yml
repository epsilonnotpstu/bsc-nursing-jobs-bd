name: Scrape nursing opportunities

on:
  schedule:
    - cron: "15 */4 * * *" # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=scraper --include-workspace-root
      - name: Run agent
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CALLS_PER_RUN: "60"
        run: npm run scrape
      - name: Commit data
        run: |
          git config user.name "nursing-jobs-bot"
          git config user.email "nursing-jobs-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Someone may have pushed code while the agent ran; replay the data commit on top.
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
